name: fix-pctabpr-regiao11
on:
  push:
    branches: [fix/pctabpr-regiao11-fila]
    paths: ['.github/workflows/fix-pctabpr-regiao11.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pctabpr-regiao11-fila
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/services/operationalSources.ts')
          s=p.read_text()
          old="""  const codeCol = col('CODPROD');\n  const regionCol = col('NUMREGIAO');\n  const branchCol = col('CODFILIAL');\n  const regionNameCol = col('REGIAO');\n  const statusCol = col('STATUSREGIAO');\n  const price1Col = col('PVENDA1');\n"""
          new="""  const codeCol = col('CODPROD');\n  const regionCol = col('NUMREGIAO');\n  const statusCol = col('STATUSREGIAO');\n  const price1Col = col('PVENDA1');\n  if (regionCol < 0) throw new Error('Tabela de Preços Winthor: campo obrigatório NUMREGIAO não encontrado.');\n"""
          if old not in s: raise SystemExit('bloco de colunas PCTABPR não encontrado')
          s=s.replace(old,new,1)
          old2="""    const region = regionCol >= 0 ? cleanCode(row[regionCol]) : '';\n    const branch = branchCol >= 0 ? cleanCode(row[branchCol]) : '';\n    const regionName = regionNameCol >= 0 ? normalizeText(row[regionNameCol]) : '';\n    const status = statusCol >= 0 ? normalizeText(row[statusCol]) : 'A';\n    const isMcdCampoGrande = region === '11' || branch === '11' || regionName.includes('CAMPO GRANDE') && regionName.includes('MCD');\n    if (!isMcdCampoGrande || (status && status !== 'A')) continue;\n"""
          new2="""    const region = cleanCode(row[regionCol]);\n    const status = statusCol >= 0 ? normalizeText(row[statusCol]) : 'A';\n    if (region !== '11' || (status && status !== 'A')) continue;\n"""
          if old2 not in s: raise SystemExit('filtro PCTABPR antigo não encontrado')
          s=s.replace(old2,new2,1)
          s=s.replace("Tabela de Preços Winthor: nenhum Preço 1 (PVENDA1) ativo da região MCD/Campo Grande foi encontrado.","Tabela de Preços Winthor: nenhum PVENDA1 ativo com NUMREGIAO=11 foi encontrado.",1)
          p.write_text(s)

          p=Path('src/pages/ConfiguracoesPage.tsx')
          s=p.read_text()
          old="""  const addFiles = (newFiles: File[]) => { setSuccess(false); setErrorMessage(''); setSelectedFiles(prev => [...prev.filter(p => !newFiles.some(n => n.name === p.name)), ...newFiles]); };\n  const removeFile = (name: string) => setSelectedFiles(prev => prev.filter(file => file.name !== name));\n"""
          new="""  const addFiles = (newFiles: File[]) => {\n    setSuccess(false); setErrorMessage('');\n    setSelectedFiles(prev => {\n      let next = [...prev];\n      for (const file of newFiles) {\n        const sourceId = sourceForFile(file.name)?.id;\n        next = next.filter(existing => {\n          const existingSourceId = sourceForFile(existing.name)?.id;\n          return sourceId ? existingSourceId !== sourceId : existing.name !== file.name;\n        });\n        next.push(file);\n      }\n      return next;\n    });\n  };\n  const removeFile = (name: string) => setSelectedFiles(prev => prev.filter(file => file.name !== name));\n  const clearQueue = () => { setSelectedFiles([]); setErrorMessage(''); setSuccess(false); };\n"""
          if old not in s: raise SystemExit('addFiles antigo não encontrado')
          s=s.replace(old,new,1)
          old3="""<button className=\"panel-primary-button\" style={{ maxWidth: '420px' }} onClick={handleProcess} disabled={!selectedFiles.length || isProcessing}>{isProcessing ? 'Processando motores...' : 'Processar arquivos selecionados'}</button>{success && <span className=\"panel-success\">Base canônica unificada atualizada.</span>}{errorMessage && <span style={{ color: 'var(--panel-red-soft)' }}>{errorMessage}</span>}"""
          new3="""<button className=\"panel-primary-button\" style={{ maxWidth: '420px' }} onClick={handleProcess} disabled={!selectedFiles.length || isProcessing}>{isProcessing ? 'Processando motores...' : 'Processar arquivos selecionados'}</button>{selectedFiles.length > 0 && <button className=\"panel-secondary-button\" onClick={clearQueue} disabled={isProcessing}>Limpar fila</button>}{success && <span className=\"panel-success\">Base canônica unificada atualizada.</span>}{errorMessage && <span style={{ color: 'var(--panel-red-soft)' }}>{errorMessage}</span>}"""
          if old3 not in s: raise SystemExit('linha de botões não encontrada')
          s=s.replace(old3,new3,1)
          p.write_text(s)

          p=Path('tests/operational-sources.test.ts')
          s=p.read_text()
          anchor="""test('PCTABPR consolida PVENDA1 elegível repetido quando os valores são iguais',()=>{\n"""
          addition="""test('PCTABPR ignora mesmo CODPROD fora de NUMREGIAO=11 mesmo quando CODFILIAL ou nome parecem MCD', () => {\n  const rows = [\n    ['CODPROD', 'NUMREGIAO', 'REGIAO', 'CODFILIAL', 'STATUSREGIAO', 'PVENDA1'],\n    [5924, 11, 'REGIAO 11', 11, 'A', 46.32],\n    [5924, 95, 'TABELA CAMPO GRANDE - MCD 2', 11, 'A', 45.39],\n  ];\n  assert.deepEqual(parseWinthorTablePrices(rows), { '5924': 46.32 });\n});\n\ntest('PCTABPR exige NUMREGIAO e não usa CODFILIAL como substituto', () => {\n  const rows = [['CODPROD','CODFILIAL','STATUSREGIAO','PVENDA1'],[5924,11,'A',46.32]];\n  assert.throws(() => parseWinthorTablePrices(rows), /NUMREGIAO/i);\n});\n\n"""
          if anchor not in s: raise SystemExit('âncora de testes PCTABPR não encontrada')
          s=s.replace(anchor,addition+anchor,1)
          p.write_text(s)

          p=Path('tests/definitive-cleanup.test.ts')
          s=p.read_text()
          s += "\n\ntest('Configurações substitui arquivo da mesma fonte e permite limpar a fila explicitamente',()=>{\n  const page=read('src/pages/ConfiguracoesPage.tsx');\n  assert.match(page,/existingSourceId !== sourceId/);\n  assert.match(page,/const clearQueue/);\n  assert.match(page,/Limpar fila/);\n});\n"
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-pctabpr-regiao11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige PCTABPR para NUMREGIAO 11 e fila de arquivos"
          git push origin HEAD:fix/pctabpr-regiao11-fila
