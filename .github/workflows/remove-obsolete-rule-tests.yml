name: remove-obsolete-rule-tests

on:
  push:
    branches:
      - feat/limpeza-padronizacao-visual
    paths:
      - '.github/workflows/remove-obsolete-rule-tests.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/limpeza-padronizacao-visual
          fetch-depth: 0
      - name: Remove obsolete tests and overlay
        run: |
          rm -f \
            tests/business-rules.test.ts \
            tests/packaging.test.ts \
            tests/parsers.test.ts \
            tests/relationships.test.ts \
            tests/utils-and-reconciliation.test.ts \
            tests/receipt-reconciliation.test.ts \
            src/services/receiptReconciliation.ts
          rm .github/workflows/remove-obsolete-rule-tests.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove testes e overlay do motor anterior já substituídos"
          git push origin HEAD:feat/limpeza-padronizacao-visual
