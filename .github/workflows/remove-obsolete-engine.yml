name: remove-obsolete-engine

on:
  push:
    branches:
      - feat/limpeza-padronizacao-visual
    paths:
      - '.github/workflows/remove-obsolete-engine.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/limpeza-padronizacao-visual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove obsolete engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          sales = Path('src/services/motors/salesMotor.ts')
          text = sales.read_text()
          text = text.replace("import { parseCompassTargets } from '../canonical/support';", "import { parseCompassTargets } from './sourceParsers';")
          sales.write_text(text)

          customer = Path('src/services/motors/customerMotor.ts')
          text = customer.read_text()
          text = text.replace("import { parseRcaMap } from '../canonical/support';", "import { parseRcaMap } from './sourceParsers';")
          customer.write_text(text)

          Path('src/services/canonical/runtime.ts').write_text("export type Row = any[];\n")

          operational = Path('src/services/operationalSources.ts')
          text = operational.read_text()
          text = text.replace("import type { MetricasEstoque, ProdutoEstoque } from '../store/DataContext';\n", "")
          start = text.find('export function operationalLegacyData')
          end = text.find('export function operationalReceiptMovements')
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          operational.write_text(text)

          obsolete = [
            'src/services/canonicalEngine.ts',
            'src/services/excelParser.ts',
            'src/services/canonical/aggregate.ts',
            'src/services/canonical/history.ts',
            'src/services/canonical/networkResolution.ts',
            'src/services/canonical/operations.ts',
            'src/services/canonical/reconciliation.ts',
            'src/services/canonical/relationships.ts',
            'src/services/canonical/support.ts',
            'src/services/canonical/supportCore.ts',
            'scripts/audit-sources.ts',
            'scripts/audit-relationships.ts',
          ]
          for name in obsolete:
              path = Path(name)
              if path.exists():
                  path.unlink()

          package = Path('package.json')
          data = json.loads(package.read_text())
          data.get('scripts', {}).pop('audit:sources', None)
          data.get('scripts', {}).pop('audit:relationships', None)
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          rm .github/workflows/remove-obsolete-engine.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove motor canônico anterior e adapters mortos"
          git push origin HEAD:feat/limpeza-padronizacao-visual
