name: final-pvenda1-fix

on:
  push:
    branches: [feat/limpeza-padronizacao-visual]
    paths: ['.github/workflows/final-pvenda1-fix.yml']

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/limpeza-padronizacao-visual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce PVENDA1 only
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/services/operationalSources.ts')
          source = source_path.read_text()
          replacements = {
              "return normalized.includes('CODPROD') && (normalized.includes('PVENDA1') || normalized.includes('PTABELA'));": "return normalized.includes('CODPROD') && normalized.includes('PVENDA1');",
              "  const legacyTableCol = col('PTABELA');\n  const tableCol = price1Col >= 0 ? price1Col : legacyTableCol;\n": "",
              "    const rawPrice = parseNumber(row[tableCol]);": "    const rawPrice = parseNumber(row[price1Col]);",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Trecho esperado não encontrado em operationalSources.ts: {old}')
              source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('tests/operational-sources.test.ts')
          test = test_path.read_text()
          old_block = """test('PCTABPR usa PTABELA ativo da região 11 e ignora outra região', () => {\n  const rows = [\n    ['CODPROD', 'NUMREGIAO', 'REGIAO', 'CODFILIAL', 'STATUSREGIAO', 'PTABELA', 'PVENDA'],\n    [565, 11, 'TABELA CAMPO GRANDE - MCD', 11, 'A', 20.27, 20.27],\n    [612, 12, 'OUTRA REGIAO', 12, 'A', 99.99, 99.99],\n    [857, 11, 'TABELA CAMPO GRANDE - MCD', 11, 'I', 50, 50],\n  ];\n  assert.deepEqual(parseWinthorTablePrices(rows), { '565': 20.27 });\n});\n"""
          new_block = """test('PCTABPR usa exclusivamente PVENDA1 ativo da região 11 e ignora PTABELA divergente', () => {\n  const rows = [\n    ['CODPROD', 'NUMREGIAO', 'REGIAO', 'CODFILIAL', 'STATUSREGIAO', 'PTABELA', 'PVENDA', 'PVENDA1'],\n    [565, 11, 'TABELA CAMPO GRANDE - MCD', 11, 'A', 99.99, 88.88, 20.27],\n    [612, 12, 'OUTRA REGIAO', 12, 'A', 77.77, 66.66, 55.55],\n    [857, 11, 'TABELA CAMPO GRANDE - MCD', 11, 'I', 50, 50, 40],\n  ];\n  assert.deepEqual(parseWinthorTablePrices(rows), { '565': 20.27 });\n});\n\ntest('PCTABPR sem PVENDA1 é rejeitada sem fallback silencioso para PTABELA', () => {\n  const rows = [\n    ['CODPROD', 'NUMREGIAO', 'STATUSREGIAO', 'PTABELA', 'PVENDA'],\n    [565, 11, 'A', 20.27, 20.27],\n  ];\n  assert.throws(() => parseWinthorTablePrices(rows), /CODPROD\\/PVENDA1/);\n});\n"""
          if old_block not in test:
              raise SystemExit('Bloco antigo de teste PCTABPR não encontrado')
          test_path.write_text(test.replace(old_block, new_block, 1))
          PY
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Verify no PTABELA fallback
        run: |
          ! grep -n "legacyTableCol\|tableCol = price1Col\|PVENDA1') || normalized.includes('PTABELA" src/services/operationalSources.ts
      - name: Commit validated fix
        run: |
          rm .github/workflows/final-pvenda1-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exige PVENDA1 sem fallback silencioso"
          git push origin HEAD:feat/limpeza-padronizacao-visual
