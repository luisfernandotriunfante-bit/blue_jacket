name: audit-cleanup-state

on:
  push:
    branches:
      - feat/limpeza-padronizacao-visual
    paths:
      - '.github/workflows/audit-cleanup-state.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/limpeza-padronizacao-visual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Audit imports and gates
        shell: bash
        run: |
          set +e
          mkdir -p .tmp-cleanup
          grep -RInE "canonicalEngine|supportCore|canonical/(aggregate|history|networkResolution|operations|reconciliation|relationships|support)" src scripts tests > .tmp-cleanup/imports.txt 2>&1
          npm run typecheck > .tmp-cleanup/typecheck.txt 2>&1
          TYPECHECK=$?
          npm run test:run > .tmp-cleanup/tests.txt 2>&1
          TESTS=$?
          npm run build > .tmp-cleanup/build.txt 2>&1
          BUILD=$?
          {
            echo '# Auditoria de fechamento da limpeza'
            echo
            echo "- Typecheck exit: $TYPECHECK"
            echo "- Tests exit: $TESTS"
            echo "- Build exit: $BUILD"
            echo
            echo '## Referências aos módulos canônicos antigos'
            cat .tmp-cleanup/imports.txt
            echo
            echo '## Typecheck'
            cat .tmp-cleanup/typecheck.txt
            echo
            echo '## Testes (últimas 300 linhas)'
            tail -n 300 .tmp-cleanup/tests.txt
            echo
            echo '## Build'
            cat .tmp-cleanup/build.txt
          } > docs/CLEANUP_GATE_REPORT_TEMP.md
          rm -rf .tmp-cleanup
          rm .github/workflows/audit-cleanup-state.yml
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Registra gates temporários da limpeza"
          git push origin HEAD:feat/limpeza-padronizacao-visual
