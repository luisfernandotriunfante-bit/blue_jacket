name: remove-obsolete-tests

on:
  push:
    branches:
      - feat/limpeza-padronizacao-visual
    paths:
      - '.github/workflows/remove-obsolete-tests.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/limpeza-padronizacao-visual
          fetch-depth: 0
      - name: Remove tests for deleted architecture
        run: |
          rm -f \
            tests/top-networks-export-filter.test.ts \
            tests/top-networks-template-format-regression.test.ts \
            tests/top-networks-visual-standardization.test.ts \
            tests/export-source-blockers.test.ts \
            tests/top-networks-model.test.ts \
            tests/templates.test.ts \
            tests/legacy-stock-report.test.ts
          rm .github/workflows/remove-obsolete-tests.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove testes dos templates e relatórios substituídos"
          git push origin HEAD:feat/limpeza-padronizacao-visual
