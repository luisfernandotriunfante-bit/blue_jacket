name: remove-operational-overlay

on:
  push:
    branches:
      - feat/limpeza-padronizacao-visual
    paths:
      - '.github/workflows/remove-operational-overlay.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/limpeza-padronizacao-visual
          fetch-depth: 0
      - name: Remove obsolete overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/services/operationalSources.ts')
          text=path.read_text()
          text=text.replace("import type { CanonicalInventoryProduct, CanonicalState, ManualConfiguration } from '../domain/canonical';\n","")
          text=text.replace("import { packagingFactorsAgree, type UnitsPerCaseSource } from '../domain/packaging';\n","")
          start=text.find('type InventoryWithPackaging')
          end=text.find('export function operationalReceiptMovements')
          if start>=0 and end>start:
              text=text[:start]+text[end:]
          path.write_text(text)
          PY
          rm .github/workflows/remove-operational-overlay.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove overlay operacional paralelo ao motor unificado"
          git push origin HEAD:feat/limpeza-padronizacao-visual
