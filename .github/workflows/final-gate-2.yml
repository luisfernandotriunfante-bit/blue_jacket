name: final-gate-2
on:
  push:
    branches: [feat/limpeza-padronizacao-visual]
    paths: ['.github/workflows/final-gate-2.yml']
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/limpeza-padronizacao-visual, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - name: Validate
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/tc 2>&1; TC=$?
          npm run test:run > /tmp/ts 2>&1; TS=$?
          npm run build > /tmp/bd 2>&1; BD=$?
          {
            echo '# Gate 2'; echo "TYPECHECK=$TC"; echo "TESTS=$TS"; echo "BUILD=$BD"; echo
            echo '## Testes'; cat /tmp/ts; echo
            echo '## Typecheck'; cat /tmp/tc; echo
            echo '## Build'; cat /tmp/bd; echo
            echo '## Resíduos runtime';
            grep -RInE "canonicalEngine|supportCore|canonical/(aggregate|history|networkResolution|operations|reconciliation|relationships|support)|legacyStock|comboClientPortfolio|detectedNetworkTarget|legacyNetwork|bj_produtos|bj_metricas|bj_sellout|GlassSurface|--bj-|applyOperationalOverrides|applyReceiptReconciliation" src package.json 2>/dev/null || true
          } > docs/FINAL_GATE_2_TEMP.md
          rm .github/workflows/final-gate-2.yml
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Registra segundo gate final" && git push origin HEAD:feat/limpeza-padronizacao-visual
